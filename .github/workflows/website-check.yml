name: Website checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Website checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Regenerate the byte view from a real pack; the committed page must match
        run: |
          node site/demo/record.mjs
          git diff --exit-code -- site/ || { echo "::error::site/ is out of date: run node site/demo/record.mjs and commit the result."; exit 1; }
      - name: Check links, anchors, images and the social image
        run: node site/demo/check.mjs
