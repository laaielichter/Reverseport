name: Diagnose

# Runs the lanes that are red and prints the failure part of their output as annotations, so the cause is
# readable without downloading logs. Delete once CI is green.
on:
  workflow_dispatch:
  push:
    branches: [ci-fix]

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: verify-package
            cmd: npm run verify:package
          - name: test-shard-1
            cmd: npm run build:cached && npm run test:ci:shard:run -- --shard=1/4
          - name: test-shard-2
            cmd: npm run build:cached && npm run test:ci:shard:run -- --shard=2/4
          - name: test-shard-3
            cmd: npm run build:cached && npm run test:ci:shard:run -- --shard=3/4
          - name: test-shard-4
            cmd: npm run build:cached && npm run test:ci:shard:run -- --shard=4/4
    env:
      NO_COLOR: "1"
      FORCE_COLOR: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run and report
        shell: bash
        run: |
          set +e
          bash -c "${{ matrix.cmd }}" > out.log 2>&1
          code=$?
          node .github/diagnose/report.mjs "${{ matrix.name }}" "$code" out.log
          exit 0
